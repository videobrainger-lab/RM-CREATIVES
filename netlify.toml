[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Canonical host redirects.
[[redirects]]
  from = "http://rmcreatives.com/*"
  to = "https://rmcreatives.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.rmcreatives.com/*"
  to = "https://rmcreatives.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.rmcreatives.com/*"
  to = "https://rmcreatives.com/:splat"
  status = 301
  force = true

# Legacy sitemap discovered in Google Search Console.
[[redirects]]
  from = "/image2.xml"
  to = "/sitemap-index.xml"
  status = 301

