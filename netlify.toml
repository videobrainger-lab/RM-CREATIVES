# Redeploy marker: SendPulse credentials rotated 2026-09-12
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "http://rmcreatives.com/*"
  to = "https://rmcreatives.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.rmcreatives.com/*"
  to = "https://rmcreatives.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.rmcreatives.com/*"
  to = "https://rmcreatives.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
